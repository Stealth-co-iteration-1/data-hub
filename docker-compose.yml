services:
  postgres:
    image: postgres:16-alpine
    container_name: data-hub-postgres
    environment:
      POSTGRES_USER: datahub
      POSTGRES_PASSWORD: datahub
      POSTGRES_DB: datahub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datahub -d datahub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
