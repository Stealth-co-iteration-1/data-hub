[project]
name = "data-hub"
version = "0.4.0"
description = "Dagster-based data pipeline for Salesforce ingestion via Nango"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.12.20",
    "dagster-postgres>=0.28.20",
    "dagster-webserver>=1.12.20",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
